server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /api/health {
    proxy_pass http://identity-service:3000/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/auth { proxy_pass http://identity-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/users { proxy_pass http://identity-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/system { proxy_pass http://identity-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/audit-logs { proxy_pass http://identity-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/notifications { proxy_pass http://identity-service:3000; include /etc/nginx/proxy_params; }

  location ^~ /api/public { proxy_pass http://cms-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/cms { proxy_pass http://cms-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/admissions { proxy_pass http://admissions-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/academics { proxy_pass http://academic-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/masters { proxy_pass http://academic-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/dashboard { proxy_pass http://academic-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/assessments { proxy_pass http://assessment-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/payroll { proxy_pass http://payroll-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /api/administration { proxy_pass http://administration-service:3000; include /etc/nginx/proxy_params; }

  location ^~ /vendor/ { proxy_pass http://identity-service:3000; include /etc/nginx/proxy_params; }
  location ^~ /uploads/ {
    alias /var/lib/nginx/uploads/;
    autoindex off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpe?g|webp|svg|ico|woff2?)$ { try_files $uri =404; expires 1h; }
  location / { try_files $uri $uri/ /index.html; }
}
